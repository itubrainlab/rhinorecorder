# Build the macOS, Linux and Windows packages, install each on its own
# platform and check it on the simulated headset. A pushed v* tag also
# attaches them to that release (a draft one is made if there is none).
name: Build packages

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["packaging/**", "pyproject.toml", ".github/workflows/build.yml"]
  workflow_dispatch:

env:
  # build_app.sh bundles the Python uv finds: a relocatable, uv-managed one.
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  linux-and-windows:
    name: Build Linux and Windows packages
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's libraries
        run: sudo apt-get update -q && sudo apt-get install -yq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Set up .venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[test]"
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q
      - name: Build
        run: |
          packaging/linux/build_linux.sh
          packaging/windows/build_windows.sh
      - name: Install and check the Linux package
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME" "$RUNNER_TEMP/pkg"
          tar -xzf dist/RhinoRecorder-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP"/pkg/RhinoRecorder-*/install.sh
          APP="$HOME/.local/share/RhinoRecorder/app"
          "$HOME/.local/bin/rhino-recorder" --version
          "$APP/python/bin/python3" -I packaging/smoke_test.py \
            "$HOME/.local/share/RhinoRecorder/runtime/$(cat "$APP/build-id")" \
            "$(.venv/bin/python -c 'import rhinorecorder; print(rhinorecorder.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  windows-check:
    name: Install and check the Windows package
    needs: linux-and-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath $env:RUNNER_TEMP\pkg
          $pkg = (Get-ChildItem $env:RUNNER_TEMP\pkg -Directory)[0].FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\install.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          $app = "$env:LOCALAPPDATA\RhinoRecorder\app"
          if (-not (Test-Path "$([Environment]::GetFolderPath('Programs'))\Rhino Recorder.lnk")) { throw 'no Start menu shortcut' }
          $build = (Get-Content "$app\build-id" -Raw).Trim()
          $version = $build.Split('-')[0]
          & "$app\python\python.exe" -I "$app\launcher.py" --version
          if ($LASTEXITCODE -ne 0) { throw 'launcher failed' }
          & "$app\python\python.exe" -I packaging\smoke_test.py "$env:LOCALAPPDATA\RhinoRecorder\runtime\$build" $version
          if ($LASTEXITCODE -ne 0) { throw 'smoke test failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\uninstall.ps1"
          if (Test-Path "$env:LOCALAPPDATA\RhinoRecorder") { throw 'uninstall left files' }

  macos:
    name: Build and check the macOS app
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up .venv
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[test]"
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q
      - name: Build
        run: packaging/macos/build_app.sh
      - name: Check the app
        run: |
          APP="dist/Rhino Recorder.app"
          RES="$APP/Contents/Resources"
          "$APP/Contents/MacOS/RhinoRecorder" --version
          "$RES/python/bin/python3" -I -B packaging/smoke_test.py \
            "$HOME/Library/Application Support/RhinoRecorder/runtime/$(cat "$RES/build-id")" \
            "$(.venv/bin/python -c 'import rhinorecorder; print(rhinorecorder.__version__)')"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-and-windows, windows-check, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum RhinoRecorder-* > SHA256SUMS
          cat SHA256SUMS
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft \
              --title "Rhino Recorder ${TAG#v}" --notes ""
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber RhinoRecorder-* SHA256SUMS
