<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A rhino pretending to be a unicorn: a strapped-on horn and a rainbow wig. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b6cf6"/>
      <stop offset="1" stop-color="#f78fb3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#f5b700"/>
      <stop offset="1" stop-color="#ffe98a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab3bd"/>
      <stop offset="1" stop-color="#8a939d"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Everything stays inside the tile: Qt's SVG renderer has no clipping. -->
  <g>
    <!-- Rainbow wig, behind the head -->
    <g fill="none" stroke-linecap="round" stroke-width="11">
      <path d="M 192 104 C 214 118, 222 150, 218 200" stroke="#ff6b9a"/>
      <path d="M 200 100 C 224 114, 234 148, 230 204" stroke="#ffd23f"/>
      <path d="M 208 98 C 234 110, 246 146, 242 206" stroke="#4dd4e8"/>
      <path d="M 186 110 C 204 126, 208 156, 204 196" stroke="#9b7bff"/>
    </g>

    <!-- Head and neck -->
    <path d="M 52 196
             C 40 190, 34 172, 40 156
             C 46 140, 62 128, 84 120
             C 104 112, 128 104, 150 100
             C 170 96, 188 98, 200 110
             L 212 150
             C 220 180, 216 214, 204 246
             L 118 246
             C 116 224, 104 208, 84 204
             C 70 203, 60 201, 52 196 Z"
          fill="url(#skin)" stroke="#555d67" stroke-width="4" stroke-linejoin="round"/>

    <!-- Ear -->
    <ellipse cx="190" cy="92" rx="13" ry="24" transform="rotate(28 190 92)"
             fill="#9aa3ad" stroke="#555d67" stroke-width="4"/>
    <ellipse cx="190" cy="94" rx="6" ry="14" transform="rotate(28 190 94)" fill="#d9a7b4"/>

    <!-- The rhino's own horns: real, stubby, and not fooling anyone -->
    <path d="M 44 154 C 38 136, 42 118, 56 104 C 58 122, 62 136, 70 146 Z"
          fill="#e6dcc8" stroke="#8a7d66" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 86 126 C 86 116, 90 108, 96 102 C 98 110, 100 117, 104 122 Z"
          fill="#e6dcc8" stroke="#8a7d66" stroke-width="3" stroke-linejoin="round"/>

    <!-- The unicorn horn, strapped on -->
    <path d="M 126 108 L 108 18 L 156 100 Z" fill="url(#gold)" stroke="#c98a00"
          stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#d99a00" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M 122.8 91.8 Q 134 88 143.5 78.7"/>
      <path d="M 119.2 73.8 Q 127 70 133.9 62.3"/>
      <path d="M 115.6 55.8 Q 120 52 124.3 45.9"/>
      <path d="M 112.0 37.8 Q 113.5 34 114.7 29.5"/>
    </g>
    <!-- Elastic strap, party-hat style -->
    <path d="M 154 103 Q 162 160 140 222" fill="none" stroke="#ff4f9a"
          stroke-width="4" stroke-linecap="round"/>

    <!-- Face -->
    <ellipse cx="100" cy="180" rx="11" ry="6" fill="#ff9fc0" opacity="0.6"/>
    <ellipse cx="118" cy="148" rx="9" ry="8" fill="#ffffff" stroke="#555d67" stroke-width="2"/>
    <circle cx="116" cy="149" r="4.5" fill="#222222"/>
    <circle cx="114.5" cy="147" r="1.6" fill="#ffffff"/>
    <g stroke="#333a42" stroke-width="2.5" stroke-linecap="round">
      <path d="M 111 141 L 108 136"/>
      <path d="M 117 139.5 L 116.5 134"/>
      <path d="M 123 141 L 125 136"/>
    </g>
    <ellipse cx="54" cy="177" rx="4" ry="3" fill="#555d67"/>
    <path d="M 54 196 Q 70 195 86 189" fill="none" stroke="#555d67" stroke-width="3"
          stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M 62 40 L 66 52 L 78 56 L 66 60 L 62 72 L 58 60 L 46 56 L 58 52 Z"/>
    <path d="M 206 34 L 209 43 L 218 46 L 209 49 L 206 58 L 203 49 L 194 46 L 203 43 Z"/>
    <path d="M 168 64 L 170 70 L 176 72 L 170 74 L 168 80 L 166 74 L 160 72 L 166 70 Z" opacity="0.85"/>
  </g>
</svg>
