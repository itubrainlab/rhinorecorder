[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhinorecorder"
dynamic = ["version"]
description = "Acquire, view, record and stream EEG from the g.tec Unicorn Hybrid Black with g.Pype"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gpype[gui,lsl,formats]>=4.1,<5",
    # g.tec's driver; wheels for these platforms only. Windows reports
    # its machine as AMD64, but uv resolving for Windows from elsewhere
    # (the Windows package is built on Linux) as x86_64, so both count.
    "gtec-unicorn>=2.0,<3; (sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')) or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
    "PySide6>=6.10.1,<6.12",
    "pyqtgraph>=0.13.3",
]
keywords = ["eeg", "bci", "unicorn", "gpype", "recorder", "lsl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.gui-scripts]
rhino-recorder = "rhinorecorder.app:main"

[tool.setuptools.dynamic]
version = { attr = "rhinorecorder.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rhinorecorder = ["MANUAL.md", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
